[package]
name = "rustips"
version = "0.3.14"
edition = "2024"
rust-version = "1.85"
description = "RustIPS - a small, fast intrusion prevention system for a single host"
license = "MIT"
repository = "https://github.com/ddc7678/RustIPS"
homepage = "https://rustips.tech/"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.8", features = ["derive"] }
libc = "0.2.191"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
thiserror = "2.0.21"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
